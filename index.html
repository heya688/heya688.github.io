<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小学英语背单词 · 人教PEP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231FA37A'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EAa%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F7F5;
  --card:#FFFFFF;
  --ink:#1F2A32;
  --muted:#6B7A86;
  --line:#E3EAE6;
  --primary:#1FA37A;
  --primary-d:#147A5B;
  --primary-soft:#E2F4EC;
  --accent:#FF8A5C;
  --accent-soft:#FFF0E7;
  --danger:#E4572E;
  --ok:#2FB27A;
  --shadow:0 6px 20px rgba(31,42,50,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 90px}

/* ===== header ===== */
header{display:flex;align-items:center;gap:12px;padding:6px 2px 16px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.logo svg{width:24px;height:24px}
.brand{flex:1;min-width:0}
.brand h1{font-size:17px;font-weight:700;letter-spacing:.2px}
.brand p{font-size:11.5px;color:var(--muted);margin-top:1px}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:#E3EAE6;stroke-width:5}
.ring .fg{fill:none;stroke:var(--primary);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--primary-d)}

/* ===== nav ===== */
.nav{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:14px;box-shadow:var(--shadow)}
.nav button{flex:1;padding:9px 0;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.18s}
.nav button.on{background:var(--primary);color:#fff}
.bookrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.bookrow::-webkit-scrollbar{display:none}
.bookrow button{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted)}
.bookrow button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-d)}

/* ===== panels ===== */
.panel{display:none}
.panel.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sect{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.sect h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sect h2 .unit-tag{font-size:11px;font-weight:600;color:var(--primary-d);background:var(--primary-soft);padding:2px 8px;border-radius:999px}
.units{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.units button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:left;transition:.15s}
.units button:hover{border-color:var(--primary)}
.units button .un{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.5px}
.units button .ut{display:block;font-size:14px;font-weight:700;margin-top:2px}
.units button .uw{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.units button .done{display:inline-block;font-size:10px;color:#fff;background:var(--ok);border-radius:999px;padding:1px 7px;margin-top:5px}

/* word cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.wcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;transition:.15s;position:relative;min-width:0}
.wcard:active{transform:scale(.97)}
.wcard .en{font-size:17px;font-weight:700;word-break:break-word;padding-right:22px}
.wcard .cn{font-size:13px;color:var(--muted);margin-top:3px}
.wcard .ip{position:absolute;top:10px;right:10px;color:var(--primary);opacity:0;transition:.2s}
.wcard:hover .ip{opacity:1}
.wcard .tag{position:absolute;top:9px;right:10px;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px}
.wcard.hard .tag{background:var(--danger);color:#fff}
.wcard.ok .tag{background:var(--ok);color:#fff}
.wcard .sound{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;color:var(--primary-d)}
.wcard .sound svg{width:15px;height:15px}

/* flashcard */
.fc-stage{max-width:520px;margin:0 auto}
.fc-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 18px;text-align:center;box-shadow:var(--shadow);cursor:pointer;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.2s}
.fc-card .big{font-size:34px;font-weight:800;letter-spacing:.5px;word-break:break-word}
.fc-card .sub{font-size:15px;color:var(--muted)}
.fc-card .hint{font-size:12px;color:var(--muted);margin-top:6px}
.fc-card.flip{background:var(--primary-soft);border-color:var(--primary)}
.fc-progress{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin:14px 0 8px}
.fc-bar{height:6px;background:#E3EAE6;border-radius:99px;overflow:hidden;margin-bottom:16px}
.fc-bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:0 auto}
.fc-actions button{padding:14px;border-radius:14px;font-size:15px;font-weight:700}
.fc-actions .no{background:#fff;border:1.5px solid var(--danger);color:var(--danger)}
.fc-actions .yes{background:var(--ok);color:#fff}
.fc-sound{display:block;margin:10px auto 0;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.fc-sound svg{width:22px;height:22px}

/* quiz */
.quiz-box{max-width:520px;margin:0 auto;text-align:center}
.quiz-box .q{font-size:20px;font-weight:700;color:var(--primary-d);margin:6px 0 2px}
.quiz-box .qfrom{font-size:12px;color:var(--muted)}
.quiz-in{display:flex;gap:8px;margin-top:16px}
.quiz-in input{flex:1;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:17px;outline:none;transition:.15s;text-align:center}
.quiz-in input:focus{border-color:var(--primary)}
.quiz-in button{padding:13px 20px;border-radius:12px;background:var(--primary);color:#fff;font-size:15px;font-weight:700}
.quiz-feedback{margin-top:14px;min-height:60px;font-size:14px}
.quiz-feedback .ok,.quiz-feedback .no{display:none}
.quiz-feedback.show-ok .ok{display:block;color:var(--ok);font-weight:700}
.quiz-feedback.show-no .no{display:block}
.quiz-feedback .no b{font-size:20px;font-weight:800}
.quiz-score{display:flex;justify-content:center;gap:22px;margin-top:10px;font-size:13px;color:var(--muted)}
.quiz-score b{font-size:18px;color:var(--ink)}

/* review */
.rev-done{text-align:center;padding:30px 10px}
.rev-done .tick{font-size:44px}
.rev-done h3{font-size:19px;font-weight:800;margin:8px 0 4px}
.rev-done p{color:var(--muted);font-size:13.5px}

/* buttons general */
.btn{border-radius:14px;padding:12px 16px;font-size:14.5px;font-weight:700}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--muted)}
.btn.primary{background:var(--primary);color:#fff}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:14px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,32,42,.45);display:none;align-items:flex-end;z-index:50}
.modal.on{display:flex}
.modal .sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px 18px 26px;max-height:82vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sheet .m-en{font-size:24px;font-weight:800}
.sheet .m-cn{font-size:15px;color:var(--muted);margin:6px 0 2px}
.sheet .m-cn b{color:var(--ink);font-size:18px}
.sheet .m-note{font-size:12px;color:var(--muted);margin-top:10px;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.sheet .act{display:flex;gap:10px;margin-top:16px}
.sheet .act button{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:14px}
.sheet .act .again{background:var(--danger);color:#fff}
.sheet .act .know{background:var(--ok);color:#fff}
.sheet .act .next{background:var(--primary);color:#fff}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1F2A32;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13.5px}
.legend{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%}
.dot.h{background:var(--danger)}.dot.o{background:var(--ok)}.dot.n{background:#E3EAE6}

@media(min-width:768px){
  .wrap{padding:26px 24px 90px}
  .brand h1{font-size:20px}
  .cards{grid-template-columns:repeat(3,1fr)}
  .units{grid-template-columns:repeat(3,1fr)}
  .modal{align-items:center}
  .modal .sheet{border-radius:20px;max-width:480px;margin:0 auto}
  .nav button{padding:11px 0}
}
</style>
</head>

  <section class="panel on" id="panel-learn">

  <!-- ===== 闪卡 ===== -->
  <section class="panel" id="panel-flash">

  <!-- ===== 拼写 ===== -->
  <section class="panel" id="panel-quiz">
    <div id="quizBody"></div>
  </section>

  <!-- ===== 复习 ===== -->
  <section class="panel" id="panel-review">
    <div id="reviewBody"></div>

</div>

<!-- 单词详情弹层 -->
<div class="modal" id="modal">

      <button class="know" id="mKnow">记住了</button>
      <button class="next" id="mNext">下一个</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const KEY_PROG='pep_progress_v1';
function keyOf(word,book,unit){return book+'|'+unit+'|'+word.e.toLowerCase()}
function allWords(){const out=[];for(const b in BOOKS)BOOKS[b].units.forEach(u=>u.w.forEach(w=>out.push({e:w[0],c:w[1],book:b,unit:u.u})));return out}
let PROG=store.get(KEY_PROG,{});

/* 间隔复习（简化SM-2）：level 0..7 对应间隔天数 */
const GAP=[0,1,2,4,7,15,30,60];
function speak(text){try{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1600)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return (s||'').trim().toLowerCase().replace(/\s+/g,' ')}

/* ============ 记忆系统 ============ */
function reviewStatus(key){const p=PROG[key];if(!p)return null;return p}
function touch(key,known){
  const p=PROG[key]||{level:0,next:0,wrong:0};
  const now=Date.now();
  if(known){
    p.level=Math.min(p.level+1,GAP.length-1);
    p.next=now+GAP[p.level]*86400000;
  }else{
    p.wrong=(p.wrong||0)+1;
    p.level=0;
    p.next=now; // 立即可复习
  }
  PROG[key]=p;store.set(KEY_PROG,PROG);updateRing();
}
function dueWords(book){
  const now=Date.now();
  const sel=book==='ALL'?allWords():BOOKS[book].units.reduce((a,u)=>a.concat(u.w.map(w=>({e:w[0],c:w[1],book:book,unit:u.u}))),[]);
  return sel.filter(w=>{const p=PROG[keyOf(w,book==='ALL'?w.book:book,w.unit)];return p&&(p.next<=now||p.wrong>0)});
}
function unitDone(book,unit){
  const u=BOOKS[book].units.find(x=>x.u===unit);if(!u||!u.w.length)return 0;
  let got=0;u.w.forEach(w=>{const p=PROG[keyOf({e:w[0]},book,unit)];if(p&&p.level>=1)got++});
  return Math.round(got/u.w.length*100);
}

  </div>`;

function startFlash(u,dir){
  const book=BOOKS[STATE.book];const unit=book.units.find(x=>x.u===u);
  const deck=shuffle(unit.w.map(w=>({e:w[0],c:w[1]})));
  let idx=0,flipped=false;
  $('#flashBody').innerHTML=`<div class="fc-stage"><div class="fc-progress"><span id="fcPos">1 / ${deck.length}</span><span id="fcLeft">剩余 ${deck.length}</span></div>
    <div class="fc-bar"><i id="fcBar" style="width:0%"></i></div>
    <div class="fc-card" id="fcCard"><div class="sub" id="fcDirLabel">${dir==='c2e'?'点击查看中文释义':'点击查看英文'}</div><div class="big" id="fcMain"></div><div class="hint" id="fcSub"></div></div>
    <button class="fc-sound" id="fcSpeak"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
    </div>
    <div class="fc-actions"><button class="no" id="fcNo">还不熟</button><button class="yes" id="fcYes">认识了</button></div>`;
  let done=0,wrong=0;
  function show(){
    const w=deck[idx];const k=keyOf(w,STATE.book,u);
    $('#fcPos').textContent=(idx+1)+' / '+deck.length;
    $('#fcBar').style.width=((idx)/deck.length*100)+'%';
    flipped=false;
    $('#fcCard').classList.remove('flip');
    $('#fcDirLabel').textContent=dir==='c2e'?'点击查看中文释义':'点击查看英文';
    $('#fcMain').textContent=dir==='c2e'?w.e:w.c;
    $('#fcSub').textContent='';
    $('#fcYes').onclick=()=>{touch(k,true);next(true)};
    $('#fcNo').onclick=()=>{touch(k,false);wrong++;next(false)};
  }
  function next(good){
    done++;idx++;
    if(idx>=deck.length){finish(done,wrong);return}
    show();
  }
  function finish(doneN,wrongN){
    $('#flashBody').innerHTML=`<div class="sect rev-done"><div class="tick">✓</div>
      <h3>这轮闪卡完成！</h3><p>共 ${deck.length} 词 · 认识 ${doneN-wrongN} · 还不熟 ${wrongN}</p>
      <div class="btn-row"><button class="btn primary" id="fcAgain">再来一轮</button><button class="btn ghost" id="fcBack">换单元</button></div></div>`;
    $('#fcAgain').onclick=()=>startFlash(u,dir);
    $('#fcBack').onclick=renderFlashSetup;
    toast('错词已进入复习队列');
  }
  $('#fcCard').onclick=()=>{
    if(!flipped){flipped=true;const w=deck[idx];$('#fcCard').classList.add('flip');
      $('#fcDirLabel').textContent='释义';
      $('#fcMain').textContent=dir==='c2e'?w.c:w.e;
      $('#fcSub').textContent=dir==='c2e'?w.e:w.c;}
  };
  $('#fcSpeak').onclick=()=>{const w=deck[idx];speak(dir==='c2e'?w.e:w.e)};
  show();
}

    $('#qzQ').textContent=w.c;
    $('#qzFb').className='quiz-feedback';
    $('#qzIn').value='';$('#qzIn').focus();
    const doCheck=()=>{
      const ans=norm($('#qzIn').value);
      if(!ans)return;
      const k=keyOf(w,STATE.book,u);
      if(ans===norm(w.e)){correct++;touch(k,true);$('#qzFb').className='quiz-feedback show-ok';$('#qzOkW').textContent=w.e;speak(w.e)}
      else{touch(k,false);$('#qzFb').className='quiz-feedback show-no';$('#qzAns').textContent=w.e;$('#qzNoW').textContent=' · '+w.c}
      $('#qzC').textContent=correct;$('#qzT').textContent=total+1;
      idx++;
      setTimeout(()=>{if(idx>=deck.length)finish();else show()},1200);
    };
    $('#qzSub').onclick=doCheck;
    $('#qzIn').onkeydown=e=>{if(e.key==='Enter')doCheck()};
  }
  function finish(){
    $('#quizBody').innerHTML=`<div class="sect rev-done"><div class="tick">★</div><h3>测验完成</h3>
      <p>正确 ${correct} / ${deck.length} · 正确率 ${Math.round(correct/deck.length*100)}%</p>
      <div class="btn-row"><button class="btn primary" id="qzAgain">再测一轮</button><button class="btn ghost" id="qzBack">换单元</button></div></div>`;
    $('#qzAgain').onclick=()=>startQuiz(u);
    $('#qzBack').onclick=renderQuizSetup;
  }
  show();
}

/* 复习 */
function renderReviewSetup(){
  const due=dueWords(STATE.book);
  if(!due.length){
    $('#reviewBody').innerHTML=`<div class="sect rev-done"><div class="tick">✓</div><h3>没有待复习的词</h3>
      <p>${STATE.book==='ALL'?'全部':'本册'}的复习任务已清空。先去学新单词或练拼写吧。</p>
      <div class="btn-row"><button class="btn primary" id="revGo">去学单词</button></div></div>`;
    $('#revGo').onclick=()=>{STATE.mode='learn';switchPanel()};
    return;
  }
  const pct=Math.round(due.length/ (STATE.book==='ALL'?allWords().length:(BOOKS[STATE.book].units.reduce((a,u)=>a+u.w.length,0)))*100);
  $('#reviewBody').innerHTML=`<div class="sect"><h2>智能复习 · ${STATE.book==='ALL'?'全部':STATE.book}</h2>
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:6px">按记忆曲线，今天有 <b style="color:var(--accent)">${due.length}</b> 个词该复习了（含做错和到期词）。</p>
    <div class="btn-row"><button class="btn primary" id="revStart">开始复习（${due.length}）</button></div></div>`;
  $('#revStart').onclick=()=>startReview(due);
}
function startReview(due){
  const deck=shuffle(due);
  let idx=0;
  const book=STATE.book==='ALL'?'':STATE.book;
  $('#reviewBody').innerHTML=`<div class="fc-stage"><div class="fc-progress"><span id="rvPos">1 / ${deck.length}</span></div>
    <div class="fc-bar"><i id="rvBar" style="width:0%"></i></div>
    <div class="fc-card" id="rvCard"><div class="sub" id="rvDir">还记得它的意思吗？</div><div class="big" id="rvMain"></div><div class="hint" id="rvSub"></div></div>
    <div class="fc-actions"><button class="no" id="rvNo">忘了</button><button class="yes" id="rvYes">记住了</button></div></div>`;
  let flipped=false;
  function show(){
    const w=deck[idx];const k=keyOf(w,w.book,w.unit);
    $('#rvPos').textContent=(idx+1)+' / '+deck.length;
    $('#rvBar').style.width=(idx/deck.length*100)+'%';
    flipped=false;$('#rvCard').classList.remove('flip');$('#rvDir').textContent='还记得它的意思吗？';
    $('#rvMain').textContent=w.e;$('#rvSub').textContent='('+w.book+' U'+w.unit+')';
    $('#rvYes').onclick=()=>{touch(k,true);next()};
    $('#rvNo').onclick=()=>{touch(k,false);next()};
  }
  function next(){idx++;if(idx>=deck.length){finish()}else show()}
  function finish(){
    $('#reviewBody').innerHTML=`<div class="sect rev-done"><div class="tick">✓</div><h3>复习完成！</h3>
      <p>今天清掉了 ${deck.length} 个复习任务，记忆更牢固了。</p>
      <div class="btn-row"><button class="btn primary" id="rvDone">好，继续</button></div></div>`;
    $('#rvDone').onclick=renderReviewSetup;
  }
  $('#rvCard').onclick=()=>{if(!flipped){flipped=true;const w=deck[idx];$('#rvCard').classList.add('flip');$('#rvDir').textContent='释义';$('#rvMain').textContent=w.c;$('#rvSub').textContent=w.e}}
  show();
}

/* 进度环 */
function updateRing(){
  const all=allWords();if(!all.length)return;
  let got=0;all.forEach(w=>{const p=PROG[keyOf(w,w.book,w.unit)];if(p&&p.level>=1)got++});
  const pct=Math.round(got/all.length*100);
  const r=20;
  const c=2*Math.PI*r;
  $('#ringFg').style.strokeDasharray=c;
  $('#ringFg').style.strokeDashoffset=c*(1-pct/100);
  $('#ringPct').textContent=pct+'%';
}

/* 事件绑定 */
$('#navMode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;STATE.mode=b.dataset.p;STATE.unit=null;switchPanel()});
$('#bookRow').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;STATE.book=b.dataset.b;STATE.unit=null;renderBookRow();switchPanel()});

/* 初始化 */
renderBookRow();
updateRing();
switchPanel();
</script>
</body>
</html>
