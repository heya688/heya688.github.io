<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收支明细记账本</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 16px;
      background-color: #f5f7fa;
    }
    .card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    h2 {
      margin-bottom: 12px;
      color: #222222;
    }
    h3 {
      margin-bottom:10px;
      color:#333;
    }
    .stat {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .stat-item {
      text-align: center;
      padding:12px;
      border-radius:8px;
    }
    .income {
      background-color:#e6f9ef;
      color:#009658;
    }
    .expense {
      background-color:#ffeef0;
      color:#d93025;
    }
    .balance {
      background-color:#eef5ff;
      color:#175de8;
    }
    form {
      display: grid;
      gap:10px;
      margin-bottom:16px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    input, select, textarea {
      padding:10px;
      border:1px solid #dddddd;
      border-radius:8px;
      font-size:16px;
    }
    button {
      padding:10px;
      border:none;
      border-radius:8px;
      background-color:#2563eb;
      color:#ffffff;
      font-size:16px;
      cursor:pointer;
    }
    .btn-danger {
      background-color:#dc2626;
    }
    .btn-group {
      display:flex;
      gap:8px;
      margin:8px 0;
      flex-wrap: wrap;
    }
    table {
      width:100%;
      border-collapse: collapse;
      margin-top:10px;
    }
    th, td {
      border-bottom:1px solid #eeeeee;
      padding:10px;
      text-align:left;
    }
    th {
      background-color:#f8fafc;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📒 收支记账本</h2>
    <div class="stat">
      <div class="stat-item income">
        <div>总收入</div>
        <div id="totalIncome">0.00</div>
      </div>
      <div class="stat-item expense">
        <div>总支出</div>
        <div id="totalExpense">0.00</div>
      </div>
      <div class="stat-item balance">
        <div>当前结余</div>
        <div id="balance">0.00</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>新增 / 编辑记录</h3>
    <form id="form">
      <input type="hidden" id="editId">
      <div class="row">
        <input type="date" id="date" required>
        <select id="type" required>
          <option value="收入">收入</option>
          <option value="支出">支出</option>
        </select>
      </div>
      <div class="row">
        <input type="text" id="category" placeholder="分类：工资/餐饮/交通" required>
        <input type="number" id="amount" step="0.01" placeholder="金额" required>
      </div>
      <textarea id="remark" placeholder="备注"></textarea>
      <button type="submit">保存记录</button>
    </form>
    <div class="btn-group">
      <button id="exportBtn">导出CSV备份</button>
      <button class="btn-danger" id="clearBtn">清空全部数据</button>
    </div>
  </div>

  <div class="card">
    <h3>收支明细列表</h3>
    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>类型</th>
          <th>分类</th>
          <th>金额</th>
          <th>备注</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>

<script>
const STORAGE_KEY = "accountBookData";
let list = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

function render(){
  const tbody = document.getElementById('list');
  tbody.innerHTML = '';
  let totalIncome = 0, totalExpense = 0;
  list.forEach(item=>{
    if(item.type === '收入') totalIncome += Number(item.amount);
    else totalExpense += Number(item.amount);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.date}</td>
      <td>${item.type}</td>
      <td>${item.category}</td>
      <td>${Number(item.amount).toFixed(2)}</td>
      <td>${item.remark}</td>
      <td>
        <button onclick="edit('${item.id}')">编辑</button>
        <button class="btn-danger" onclick="del('${item.id}')">删除</button>
      </td>
    `;
    tbody.appendChild(tr);
  })
  document.getElementById('totalIncome').innerText = totalIncome.toFixed(2);
  document.getElementById('totalExpense').innerText = totalExpense.toFixed(2);
  document.getElementById('balance').innerText = (totalIncome - totalExpense).toFixed(2);
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  render();
}

document.getElementById('form').addEventListener('submit',e=>{
  e.preventDefault();
  const id = document.getElementById('editId').value;
  const data = {
    id: id || Date.now().toString(),
    date: document.getElementById('date').value,
    type: document.getElementById('type').value,
    category: document.getElementById('category').value,
    amount: document.getElementById('amount').value,
    remark: document.getElementById('remark').value
  };
  if(id){
    const idx = list.findIndex(x=>x.id===id);
    list[idx] = data;
  }else{
    list.push(data);
  }
  document.getElementById('form').reset();
  document.getElementById('editId').value = '';
  save();
})

window.edit = function(id){
  const item = list.find(x=>x.id===id);
  if(!item) return;
  document.getElementById('editId').value = item.id;
  document.getElementById('date').value = item.date;
  document.getElementById('type').value = item.type;
  document.getElementById('category').value = item.category;
  document.getElementById('amount').value = item.amount;
  document.getElementById('remark').value = item.remark;
}

window.del = function(id){
  if(!confirm('确定删除这条记录？')) return;
  list = list.filter(x=>x.id!==id);
  save();
}

document.getElementById('exportBtn').onclick = ()=>{
  const escapeCell = (s) => `"${ String(s ?? '').replace(/"/g, '""') }"`;
  let csvContent = "\uFEFF日期,收支类型,分类,金额,备注\n";
  list.forEach(item => {
    const row = [
      escapeCell(item.date),
      escapeCell(item.type),
      escapeCell(item.category),
      escapeCell(item.amount),
      escapeCell(item.remark)
    ];
    csvContent += row.join(',') + '\n';
  });
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8" });
  const downloadUrl = URL.createObjectURL(blob);
  const aTag = document.createElement('a');
  aTag.href = downloadUrl;
  aTag.download = "收支明细.csv";
  aTag.click();
  URL.revokeObjectURL(downloadUrl);
}

document.getElementById('clearBtn').onclick = ()=>{
  if(!confirm('⚠️确定清空所有记账数据？无法恢复！建议先【导出CSV备份】！')) return;
  list = [];
  save();
}

render();
</script>
</body>
</html>
