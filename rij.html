<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的日记记事本</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#4F46E5',
      },
      fontFamily: {
        sans: ['system-ui', 'sans-serif'],
      },
    }
  }
}
</script>
<style type="text/tailwindcss">
@layer utilities {
  .content-auto {
    content-visibility: auto;
  }
  .card-shadow {
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
}
</style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">
<div class="max-w-2xl mx-auto px-4 py-6">
  <!-- 头部 -->
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-[clamp(1.4rem,4vw,2rem)] font-bold text-slate-800">
      <i class="fa fa-book text-primary mr-2"></i>我的日记
    </h1>
    <button onclick="exportAll()" class="bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm">
      <i class="fa fa-download mr-1"></i>导出全部
    </button>
  </header>

  <!-- 新增/编辑表单 -->
  <div class="bg-white rounded-xl p-4 card-shadow mb-6">
    <input type="hidden" id="editId" value="">
    <textarea id="diaryContent" placeholder="写下今天的心情..."
      class="w-full border border-slate-200 rounded-lg p-3 h-40 outline-primary resize-none"></textarea>
    <div class="flex gap-2 mt-3">
      <button onclick="saveDiary()" class="bg-primary text-white px-4 py-2 rounded-lg flex-1">
        <i class="fa fa-save mr-1"></i>保存
      </button>
      <button onclick="cancelEdit()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg">
        取消
      </button>
    </div>
  </div>

  <!-- 日记列表 -->
  <div id="listWrap"></div>
</div>

<script>
// 读取本地存储
function getDiaryList(){
  const raw = localStorage.getItem("myDiary");
  return raw ? JSON.parse(raw) : [];
}
function saveList(arr){
  localStorage.setItem("myDiary", JSON.stringify(arr));
}

// 渲染列表
function render(){
  const list = getDiaryList();
  const wrap = document.getElementById("listWrap");
  if(list.length === 0){
    wrap.innerHTML = `<div class="text-center py-10 text-slate-400">暂无日记，开始记录吧 ✍️</div>`;
    return;
  }
  let html = "";
  list.reverse().forEach(item=>{
    html += `
    <div class="bg-white rounded-xl p-4 card-shadow mb-4">
      <div class="text-sm text-slate-500 mb-2">
        <i class="fa fa-calendar-o mr-1"></i>${item.time}
      </div>
      <div class="text-slate-700 whitespace-pre-wrap break-words">${escapeHtml(item.content)}</div>
      <div class="flex justify-end gap-2 mt-3 pt-2 border-t border-slate-100">
        <button onclick="editDiary('${item.id}')" class="text-blue-600 text-sm">
          <i class="fa fa-pencil"></i> 编辑
        </button>
        <button onclick="delDiary('${item.id}')" class="text-red-500 text-sm">
          <i class="fa fa-trash"></i> 删除
        </button>
      </div>
    </div>`
  })
  wrap.innerHTML = html;
}

// 保存日记（新增/编辑）
function saveDiary(){
  const content = document.getElementById("diaryContent").value.trim();
  const editId = document.getElementById("editId").value;
  if(!content){
    alert("内容不能为空");
    return;
  }
  const list = getDiaryList();
  if(editId){
    // 编辑模式
    const idx = list.findIndex(x=>x.id === editId);
    if(idx >=0){
      list[idx].content = content;
      list[idx].updateTime = new Date().toLocaleString();
    }
  }else{
    // 新增
    list.push({
      id: Date.now().toString(),
      content,
      time: new Date().toLocaleString(),
    })
  }
  saveList(list);
  cancelEdit();
  render();
}

// 编辑
function editDiary(id){
  const list = getDiaryList();
  const item = list.find(x=>x.id === id);
  if(!item) return;
  document.getElementById("editId").value = id;
  document.getElementById("diaryContent").value = item.content;
  document.getElementById("diaryContent").focus();
  window.scrollTo({top:0, behavior:"smooth"});
}

// 取消编辑
function cancelEdit(){
  document.getElementById("editId").value = "";
  document.getElementById("diaryContent").value = "";
}

// 删除
function delDiary(id){
  if(!confirm("确定删除这条日记吗？")) return;
  let list = getDiaryList();
  list = list.filter(x=>x.id !== id);
  saveList(list);
  render();
}

// 导出全部为txt
function exportAll(){
  const list = getDiaryList();
  if(list.length === 0){
    alert("没有日记可以导出");
    return;
  }
  let text = "===== 我的日记 =====\n\n";
  list.forEach(item=>{
    text += `【${item.time}】\n${item.content}\n\n-------------------------\n\n`
  })
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "我的日记_" + new Date().toLocaleDateString() + ".txt";
  a.click();
  URL.revokeObjectURL(url);
}

// XSS转义
function escapeHtml(str){
  return str
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;")
}

// 初始化
render();
</script>
</body>
</html>
